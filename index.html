<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <style>
       *{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#e6e5e5;
}

.franja-celeste{
    width:100%;
    height:4rem;
    background:#c4edf1;
}

.barra{
    height:4rem;
    background:white;
    position:relative;
}

.pestana{
    width:8rem;
    height:2rem;
    background:#ff9978;
    position:absolute;
    left:0;
    bottom:0;
}

.menu{
    height:100%;
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:2rem;
    padding-right:3rem;
}

.item{
    width:4rem;
    height:.8rem;
    background:#c8c8c8;
}

.hero{
    height:20rem;
    background:white;
    display:flex;
    justify-content:center;
    align-items:center;
}

.buscador{
    width:35rem;
    height:4rem;
    background:#ff9978;
    display:flex;
}

.buscador input{
    flex:1;
    border:none;
}

.buscador button{
    width:4rem;
    border:none;
    background:#656a73;
}

.informacion{
    background:#c4edf1;
    padding:4rem;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:6rem;
}

.cuadro-lateral{
    width:14rem;
    height:14rem;
    background:#91d3d9;
}

.texto{
    width:35rem;
}

.texto h1{
    height:1.5rem;
    background:#656a73;
    margin-bottom:1.5rem;
}

.texto p{
    height:.8rem;
    background:white;
    margin-bottom:1rem;
}

.corta{
    width:70%;
}

.tarjetas{
    background:white;
    padding:4rem;
    display:flex;
    justify-content:center;
    gap:5rem;
}

.tarjeta{
    width:15rem;
}

.imagen-naranja{
    width:15rem;
    height:15rem;
    background:#ff9978;
}

.imagen-celeste{
    width:15rem;
    height:15rem;
    background:#91d3d9;
    border:.3rem solid #a9e4e8;
}

.imagen-amarilla{
    width:15rem;
    height:15rem;
    background:#ffc86d;
    border:.3rem solid #ffb959;
}

.tarjeta h2{
    height:1rem;
    background:#656a73;
    margin-top:1rem;
    margin-bottom:1rem;
}

.tarjeta p{
    height:.7rem;
    background:#c8c8c8;
    margin-bottom:.6rem;
}

    </style>
</body>
</html>
